name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  packages: write

jobs:
  # Pull requests into main are releases: from a release-X.Y.Z branch, with
  # the versions and a dated CHANGELOG.md section for X.Y.Z.
  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions and changelog
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          V="${BRANCH#release-}"
          V="${V#v}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Releases come from release-X.Y.Z branches, not $BRANCH"
            exit 1
          fi
          for f in server/package.json selector/package.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$V" ]; then
              echo "$f says $got, the release is $V"
              exit 1
            fi
          done
          if ! grep -qE "^## \[$V\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## [$V] - YYYY-MM-DD' section"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      - name: Run server tests
        run: npx vitest run
        working-directory: server

      - name: Check runtime script
        run: node --check runtime/renplay-runtime.js

      # No semicolons, em or en dashes, or ellipses in text people read (AGENTS.md).
      - name: Check the writing rule
        run: node scripts/check-copy.mjs

      - name: Install selector deps
        run: npm ci
        working-directory: selector

      - name: Typecheck selector
        run: npx tsc -b --noEmit
        working-directory: selector

      - name: Build selector
        run: npm run build
        working-directory: selector

  install-contract:
    name: Install contract (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: renplay:contract
          cache-from: type=gha,scope=contract-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=contract-${{ matrix.arch }}
      - name: User IDs and read-only root filesystem
        run: python3 deploy/test-contract.py renplay:contract users
      - name: Native Ren'Py install and game HTTP smoke test
        run: python3 deploy/test-contract.py renplay:contract smoke
      - name: Upgrade and downgrade from 2.11.1
        run: python3 deploy/test-contract.py renplay:contract upgrade
      - name: Upgrade and downgrade from 3.2.0
        run: python3 deploy/test-contract.py renplay:contract upgrade32
      - name: Separate downloads mount
        run: python3 deploy/test-contract.py renplay:contract all --downloads

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: docs/site
      - name: Generated configuration stays current
        run: npm run gen && git diff --exit-code -- src/content/docs/configuration.md
        working-directory: docs/site
      - run: npm run build
        working-directory: docs/site

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      # chart-testing's YAML validator (yamale) still uses ast.Num, which Python 3.14 removed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: helm/chart-testing-action@v2.7.0
      - name: Lint and render the install contract
        run: |
          helm lint charts/renplay --strict
          python3 deploy/test-chart.py
          python3 deploy/test-package-chart.py
          ct lint --config .github/ct.yaml --charts charts/renplay --lint-conf .github/chart-lint.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Chart values reference stays current
        run: |
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          helm-docs --chart-search-root charts/renplay
          git diff --exit-code -- charts/renplay/README.md
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: chart-testing
      # Test the chart with the image built from this commit: a release bumps appVersion before
      # its image exists, and the chart should be tested with the code it ships with.
      - name: Build the image for the chart test
        run: |
          docker build -t ghcr.io/renplay-org/renplay:chart-test .
          kind load docker-image ghcr.io/renplay-org/renplay:chart-test --name chart-testing
      - name: Install and test on kind
        run: ct install --config .github/ct.yaml --charts charts/renplay --helm-extra-set-args "--set=image.tag=chart-test --set=image.pullPolicy=Never"

  build:
    needs: [check, install-contract, docs, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:${{ github.sha }}
