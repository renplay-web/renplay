name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from merge commit
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=""
          MSG=$(git log -1 --format=%s)
          echo "Commit message: $MSG"

          # Strategy 1: Standard merge commit
          # "Merge pull request #N from org/release-v0.1.1"
          if echo "$MSG" | grep -qE 'release-([vV]?[0-9]+\.[0-9]+\.[0-9]+)'; then
            VERSION=$(echo "$MSG" | sed -nE 's/.*release-([vV]?[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
            echo "Strategy 1 matched: $VERSION"

          # Strategy 2: Squash merge — extract PR number, get branch via API
          elif echo "$MSG" | grep -qE '\(#[0-9]+\)$'; then
            PR=$(echo "$MSG" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
            echo "Strategy 2: PR #$PR"
            BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
            echo "Source branch: $BRANCH"
            if echo "$BRANCH" | grep -qE 'release-([vV]?[0-9]+\.[0-9]+\.[0-9]+)'; then
              VERSION=$(echo "$BRANCH" | sed -nE 's/.*release-([vV]?[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
              echo "Strategy 2 matched: $VERSION"
            fi

          # Strategy 3: Version string anywhere in message
          # "Release v0.1.1 (#123)" or "v0.1.1"
          elif echo "$MSG" | grep -qE '(^|[^0-9])([vV]?[0-9]+\.[0-9]+\.[0-9]+)'; then
            VERSION=$(echo "$MSG" | sed -nE 's/.*([vV]?[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
            echo "Strategy 3 matched: $VERSION"
          fi

          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Final version: [$VERSION]"

  create:
    needs: [detect]
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.detect.outputs.version }}"
          TAG="v$V"
          if gh release view "$TAG" --json name > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

  build:
    needs: [detect]
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.detect.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
